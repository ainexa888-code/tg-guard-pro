services:
  - type: web
    name: tg-guard-pro
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/main.py"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: BOT_NAME
        value: TG GUARD PRO
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_LANGUAGE
        value: Hindi
      - key: BOT_TOKEN
        value: "8832895009:AAFlOPnTRwv5MoE53kd-d8cox5QEGgQCJ5o"
      - key: OWNER_ID
        value: "8741198488"
      - key: LOG_CHAT_ID
        value: "8741198488"
      - key: DATABASE_URL
        fromDatabase:
          name: tg-guard-pro-db
          property: connectionString
      - key: PORT
        value: "10000"
