services:
  - type: web
    name: group-predictor-bot
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python scripts/run_bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: BOT_NAME
        value: "Group Predictor Bot"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_LANGUAGE
        value: Hindi
      - key: BOT_TOKEN
        value: "8832895009:AAFlOPnTRwv5MoE53kd-d8cox5QEGgQCJ5o"
      - key: MASTER_OWNER_ID
        value: "8741198488"
      - key: OWNER_ID
        value: "8741198488"
      - key: LOG_CHAT_ID
        value: "8741198488"
      - key: PORT
        value: "10000"
